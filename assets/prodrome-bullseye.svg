<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 640 380"
  role="img"
  aria-labelledby="bullseye-title bullseye-desc"
  font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
>
  <title id="bullseye-title">Prodrome Zone</title>
  <desc id="bullseye-desc">
    A reticle of four concentric rings with crosshair ticks around a small warm centre,
    marking the deep-brain region of the theory: the thalamus, hypothalamus, and pineal body.
  </desc>

  <text
    x="320"
    y="52"
    text-anchor="middle"
    fill="#41d4c8"
    font-size="15"
    letter-spacing="0.18em"
  >PRODROME ZONE</text>

  <!-- Rings and ticks are the instrument; only the centre carries the theory's colour. -->
  <g transform="translate(320 205)" fill="none" stroke="#41d4c8" stroke-opacity="0.28" stroke-width="1">
    <circle r="120" />
    <circle r="94" stroke-opacity="0.2" />
    <circle r="66" stroke-opacity="0.2" />
    <circle r="38" stroke-opacity="0.2" />
  </g>

  <!-- Ticks straddle the outer ring; they must clear the title above and the caption below. -->
  <g stroke="#41d4c8" stroke-opacity="0.45" stroke-width="1" stroke-linecap="round">
    <line x1="320" y1="75" x2="320" y2="95" />
    <line x1="320" y1="315" x2="320" y2="335" />
    <line x1="190" y1="205" x2="210" y2="205" />
    <line x1="430" y1="205" x2="450" y2="205" />
  </g>

  <g transform="translate(320 205)">
    <circle r="26" fill="#ff7a45" opacity="0.12" />
    <circle r="13" fill="#ff7a45" opacity="0.35" />
    <circle r="6" fill="#ffd9a8" />
  </g>

  <text
    x="320"
    y="360"
    text-anchor="middle"
    fill="#9db3bf"
    font-size="12.5"
    letter-spacing="0.1em"
  >thalamus · hypothalamus · pineal body</text>
</svg>
