<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Migraine phases timeline</title>
  <desc id="desc">A labelled arrow showing Prodrome, Aura, Headache, and Resolution phases with their typical durations.</desc>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#1f5a66"/>
    </marker>
  </defs>

  <rect width="1200" height="260" rx="0" fill="#ffffff"/>

  <path d="M110 58 H1082" fill="none" stroke="#1f5a66" stroke-width="2" marker-end="url(#arrowhead)"/>
  <text x="596" y="36" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="650" fill="#1f5a66">Migraine phases over time</text>

  <g transform="translate(90 92)">
    <path d="M0 106 L232 4 L464 106 Z" fill="#fdeede" stroke="#e6a664" stroke-width="2"/>
    <path d="M238 106 L348 34 L458 106 Z" fill="#efeafb" stroke="#b7a6e0" stroke-width="2"/>
    <path d="M460 106 L702 8 L944 106 Z" fill="#fde7e2" stroke="#eaa695" stroke-width="2"/>
    <path d="M748 106 L886 34 L1024 106 Z" fill="#e6f4ec" stroke="#9fd0b4" stroke-width="2"/>

    <line x1="0" y1="130" x2="1024" y2="130" stroke="#cddadd" stroke-width="2"/>
    <line x1="232" y1="118" x2="232" y2="142" stroke="#b9cdd2" stroke-width="2"/>
    <line x1="348" y1="118" x2="348" y2="142" stroke="#b9cdd2" stroke-width="2"/>
    <line x1="702" y1="118" x2="702" y2="142" stroke="#b9cdd2" stroke-width="2"/>
    <line x1="886" y1="118" x2="886" y2="142" stroke="#b9cdd2" stroke-width="2"/>

    <text x="232" y="68" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="720" fill="#a5491b">Prodrome</text>
    <text x="232" y="94" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#566b72">1 hr-48 hrs</text>

    <text x="348" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="720" fill="#5a47a0">Aura</text>
    <text x="348" y="99" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#566b72">5 min-1 hr</text>

    <text x="702" y="70" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="720" fill="#b23a2c">Headache</text>
    <text x="702" y="96" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="17" fill="#566b72">4-72 hrs</text>

    <text x="886" y="75" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="720" fill="#2f8a5b">Resolution</text>
    <text x="886" y="99" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="#566b72">1-2 days</text>
  </g>
</svg>
